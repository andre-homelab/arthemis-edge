http:
  middlewares:
    cors-default:
      headers:
        accessControlAllowCredentials: true
        accessControlAllowHeaders:
          - Authorization
          - Content-Type
          - Origin
          - Accept
          - X-Requested-With
          - X-Request-Id
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        accessControlAllowOriginList:
          - http://localhost
          - http://localhost:3000
          - http://localhost:5173
          - http://127.0.0.1:3000
          - http://127.0.0.1:5173
        accessControlExposeHeaders:
          - Content-Length
          - Content-Type
          - X-Request-Id
        addVaryHeader: true

    security-default:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: no-referrer

    gateway-chain:
      chain:
        middlewares:
          - security-default
          - cors-default

    strip-brain-prefix:
      stripPrefix:
        prefixes:
          - /brain

    strip-watcher-prefix:
      stripPrefix:
        prefixes:
          - /watcher
